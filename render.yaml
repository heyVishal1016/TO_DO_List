services:
  - type: web
    name: taskflow-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    autoDeploy: true
    disk:
      name: taskflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/todos.db
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_RETENTION_DAILY
        value: 7
      - key: BACKUP_RETENTION_WEEKLY
        value: 4
      - key: BACKUP_MAX_MB
        value: 500
      - key: FRONTEND_URL
        sync: false
